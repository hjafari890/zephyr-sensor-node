# System and Kernel
CONFIG_MULTITHREADING=y
CONFIG_FPU=y

# Console and Logging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_DEFAULT_LEVEL=3

# Standard Library and Randomness
CONFIG_NEWLIB_LIBC=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Sensor Subsystem
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SPI=y

# Specific Sensor Drivers
CONFIG_MAX30101=y
CONFIG_ADXL362=y
# ADS1292 driver usually requires custom implementation, but we enable SPI for it
# BME680 and VCNL4040 would go here if active

# CBPRINTF (Floating point printf for sensor readings)
CONFIG_CBPRINTF_FP_SUPPORT=y

# Message Queue configs (if needed for tuning)
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

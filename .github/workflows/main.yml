name: Biomedical Sensor-Node CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Zephyr SDK & West
      run: |
        pip install west
        west init zephyrproject
        cd zephyrproject
        west update
        west zephyr-export
        pip install -r zephyr/scripts/requirements.txt
        wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.1/zephyr-sdk-0.16.1_linux-x86_64.tar.xz
        tar xvf zephyr-sdk-0.16.1_linux-x86_64.tar.xz
        cd zephyr-sdk-0.16.1
        ./setup.sh -t all -h -c

    - name: Build Firmware
      run: |
        cd zephyrproject/zephyr
        west build -p always -b nrf52840dk/nrf52840 ../../app/
        mkdir -p ../../build/zephyr
        cp build/zephyr/zephyr.elf ../../build/zephyr/zephyr.elf

    - name: Install Renode & Robot Framework
      run: |
        wget https://github.com/renode/renode/releases/download/v1.15.0/renode-1.15.0.linux-portable.tar.gz
        tar -xzf renode-1.15.0.linux-portable.tar.gz
        pip install -r renode_1.15.0_portable/tests/requirements.txt robotframework==6.0.2

    - name: Run Renode Automated Tests (Phase 7)
      run: |
        export PATH=$PATH:$PWD/renode_1.15.0_portable
        renode-test tests/test_fusion_alarm.robot

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: robot-test-results
        path: |
          report.html
          log.html
